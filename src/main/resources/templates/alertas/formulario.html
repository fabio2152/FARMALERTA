<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Registrar alerta sanitaria</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Registrar alerta sanitaria</h1>

    <p class="text-muted">
        Todos los lotes con ese número, de todas las sucursales de la empresa, quedarán bloqueados.
    </p>

    <form th:action="@{/alertas}" method="post">

        <div class="row g-3">

            <div class="col-md-5">
                <label class="form-label">Producto</label>
                <select class="form-select" name="productoId" required>
                    <option
                        th:each="p : ${productos}"
                        th:value="${p.id}"
                        th:text="${p.nombreComercial + ' ' + p.concentracion}"
                    ></option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Número de lote</label>
                <input type="text" class="form-control" name="numeroLote" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Documento de referencia</label>
                <input type="text" class="form-control" name="documentoReferencia" placeholder="Alerta DIGEMID N.° ..." required>
            </div>

        </div>

        <div class="mt-4">

            <button type="submit" class="btn btn-danger">Registrar y bloquear</button>

            <a class="btn btn-secondary" th:href="@{/alertas}">Cancelar</a>

        </div>

    </form>

</div>

</body>

</html>
