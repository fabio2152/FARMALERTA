<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Alertas sanitarias</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">

        <h1>Alertas sanitarias</h1>

        <a
            th:if="${usuario.rol.name() == 'QUIMICO_FARMACEUTICO'}"
            class="btn btn-danger"
            th:href="@{/alertas/nueva}"
        >
            Registrar alerta
        </a>

    </div>


    <div class="table-responsive">

        <table class="table table-striped align-middle">

            <thead>
            <tr>
                <th>Fecha</th>
                <th>Producto</th>
                <th>Lote</th>
                <th>Documento</th>
                <th>Registró</th>
                <th>Estado</th>
                <th></th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="a : ${alertas}">
                <td th:text="${#temporals.format(a.fechaRegistro, 'dd/MM/yyyy')}"></td>
                <td th:text="${a.producto.nombreComercial + ' ' + a.producto.concentracion}"></td>
                <td th:text="${a.numeroLote}"></td>
                <td th:text="${a.documentoReferencia}"></td>
                <td th:text="${a.registradaPor.nombreUsuario}"></td>
                <td>
                    <span th:if="${!a.levantada}" class="badge bg-danger">Vigente</span>
                    <span th:if="${a.levantada}" class="badge bg-secondary" th:text="${'Levantada: ' + a.documentoLevantamiento}"></span>
                </td>
                <td>
                    <form
                        th:if="${!a.levantada and usuario.rol.name() == 'QUIMICO_FARMACEUTICO'}"
                        th:action="@{/alertas/{id}/levantar(id=${a.id})}"
                        method="post"
                        class="d-flex gap-1"
                    >
                        <input type="text" class="form-control form-control-sm" name="documentoLevantamiento" placeholder="Documento" required>
                        <button type="submit" class="btn btn-outline-success btn-sm">Levantar</button>
                    </form>
                </td>
            </tr>
            </tbody>

        </table>

    </div>


    <div th:if="${#lists.isEmpty(alertas)}" class="alert alert-info">
        No hay alertas sanitarias registradas.
    </div>

</div>

</body>

</html>
