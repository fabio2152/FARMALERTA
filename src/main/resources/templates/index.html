<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Farmalerta</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<section class="hero">

    <div class="container text-center">

        <h1 class="display-4 fw-bold">
            Farmalerta
        </h1>

        <p class="lead">
            Controla cada lote por su fecha de vencimiento y recibe avisos a tiempo.
        </p>

        <p>
            Ningún producto vencido llega al paciente.
        </p>

        <a
            class="btn btn-primary btn-lg"
            th:href="@{/login}"
        >
            Iniciar sesión
        </a>

        <a
            class="btn btn-outline-success btn-lg"
            th:href="@{/ofertas}"
        >
            Ver ofertas
        </a>

    </div>

</section>

</body>

</html>
