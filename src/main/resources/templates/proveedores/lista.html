<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Proveedores</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Proveedores</h1>

        <a class="btn btn-primary" th:href="@{/proveedores/nuevo}">
            Nuevo proveedor
        </a>

    </div>


    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead>
            <tr>
                <th>Razón social</th>
                <th>RUC</th>
                <th>Acepta canje</th>
                <th>Días mínimos</th>
                <th>% reconocido</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="proveedor : ${proveedores}">
                <td th:text="${proveedor.razonSocial}"></td>
                <td th:text="${proveedor.ruc}"></td>
                <td th:text="${proveedor.aceptaCanje ? 'Sí' : 'No'}"></td>
                <td th:text="${proveedor.diasMinimosCanje}"></td>
                <td th:text="${proveedor.porcentajeReconocido + ' %'}"></td>
                <td>

                    <a class="btn btn-warning btn-sm" th:href="@{/proveedores/{id}/editar(id=${proveedor.id})}">
                        Editar
                    </a>

                    <form
                        th:action="@{/proveedores/{id}/eliminar(id=${proveedor.id})}"
                        method="post"
                        style="display:inline"
                    >
                        <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Desea eliminar el proveedor?')"
                        >
                            Eliminar
                        </button>
                    </form>

                </td>
            </tr>
            </tbody>

        </table>

    </div>


    <div th:if="${#lists.isEmpty(proveedores)}" class="alert alert-info">
        No existen proveedores registrados.
    </div>

</div>

</body>

</html>
