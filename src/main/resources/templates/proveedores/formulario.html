<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Proveedor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1 th:text="${proveedor.id == null} ? 'Nuevo proveedor' : 'Editar proveedor'"></h1>

    <form
        th:object="${proveedor}"
        th:action="${proveedor.id == null} ? @{/proveedores} : @{/proveedores/{id}(id=${proveedor.id})}"
        method="post"
    >

        <div class="row g-3">

            <div class="col-md-8">
                <label class="form-label">Razón social</label>
                <input type="text" class="form-control" th:field="*{razonSocial}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">RUC</label>
                <input type="text" class="form-control" th:field="*{ruc}" pattern="\d{11}" maxlength="11" required>
            </div>

            <div class="col-md-4">
                <div class="form-check mt-4">
                    <input type="checkbox" class="form-check-input" th:field="*{aceptaCanje}">
                    <label class="form-check-label">Acepta canje por vencimiento</label>
                </div>
            </div>

            <div class="col-md-4">
                <label class="form-label">Días mínimos para el canje</label>
                <input type="number" min="0" class="form-control" th:field="*{diasMinimosCanje}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Porcentaje reconocido (%)</label>
                <input type="number" step="0.01" min="0" max="100" class="form-control" th:field="*{porcentajeReconocido}" required>
            </div>

        </div>

        <div class="mt-4">

            <button type="submit" class="btn btn-success">Guardar</button>

            <a class="btn btn-secondary" th:href="@{/proveedores}">Cancelar</a>

        </div>

    </form>

</div>

</body>

</html>
