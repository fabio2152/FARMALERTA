<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Ingreso de lote</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Ingreso de lote</h1>

    <form th:action="@{/lotes}" method="post">

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Producto</label>
                <select class="form-select" name="productoId" required>
                    <option
                        th:each="p : ${productos}"
                        th:value="${p.id}"
                        th:text="${p.nombreComercial + ' ' + p.concentracion + ' (' + p.unidadesPorEmpaque + ' u. por empaque)'}"
                    ></option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Proveedor</label>
                <select class="form-select" name="proveedorId" required>
                    <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.razonSocial}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Número de lote</label>
                <input type="text" class="form-control" name="numeroLote" required>
            </div>

            <div class="col-md-8">

                <label class="form-label">Fecha de vencimiento</label>

                <div class="d-flex flex-wrap gap-3 mb-2">

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoFecha" value="completa" id="fechaCompleta" checked>
                        <label class="form-check-label" for="fechaCompleta">Fecha completa</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoFecha" value="mes" id="fechaMes">
                        <label class="form-check-label" for="fechaMes">Solo mes y año (vence el último día del mes)</label>
                    </div>

                </div>

                <div class="row g-2">

                    <div class="col">
                        <input type="date" class="form-control" name="fechaVencimiento">
                    </div>

                    <div class="col">
                        <input type="month" class="form-control" name="mesAnio" placeholder="AAAA-MM">
                    </div>

                </div>

            </div>

            <div class="col-md-4">
                <label class="form-label">Cantidad</label>
                <input type="number" min="1" class="form-control" name="cantidad" required>
            </div>

            <div class="col-md-4">

                <label class="form-label d-block">La cantidad está en</label>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="unidadCantidad" value="unidades" id="enUnidades" checked>
                    <label class="form-check-label" for="enUnidades">Unidades</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="unidadCantidad" value="empaques" id="enEmpaques">
                    <label class="form-check-label" for="enEmpaques">Empaques</label>
                </div>

            </div>

            <div class="col-md-4">
                <label class="form-label">Costo unitario por unidad mínima (S/)</label>
                <input type="number" step="0.01" min="0.01" class="form-control" name="costoUnitario" required>
            </div>

        </div>

        <div class="mt-4">

            <button type="submit" class="btn btn-success">Ingresar</button>

            <a class="btn btn-secondary" th:href="@{/lotes}">Cancelar</a>

        </div>

    </form>

</div>

</body>

</html>
