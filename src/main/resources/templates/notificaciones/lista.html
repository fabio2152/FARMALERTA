<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Notificaciones</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Notificaciones</h1>

    <div class="list-group">

        <div
            class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2"
            th:each="n : ${notificaciones}"
            th:classappend="${n.leida} ? 'text-muted' : ''"
        >

            <div>
                <span th:class="${'nivel nivel-' + n.nivel}" th:text="${n.nivel}"></span>
                <small th:text="${#temporals.format(n.fecha, 'dd/MM/yyyy') + ' · ' + n.sucursal.nombre}"></small>
                <div>
                    <a th:href="@{/lotes/{id}(id=${n.lote.id})}" th:text="${n.mensaje}"></a>
                </div>
            </div>

            <form th:if="${!n.leida}" th:action="@{/notificaciones/{id}/leida(id=${n.id})}" method="post">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Marcar como leída</button>
            </form>

        </div>

    </div>


    <div th:if="${#lists.isEmpty(notificaciones)}" class="alert alert-info">
        No hay notificaciones.
    </div>

</div>

</body>

</html>
