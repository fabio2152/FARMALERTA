<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Detalle de la empresa</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <div class="card shadow mb-4">

        <div class="card-body">

            <h1 th:text="${empresa.razonSocial}"></h1>

            <p class="mb-0">
                <strong>RUC:</strong>
                <span th:text="${empresa.ruc}"></span>
            </p>

        </div>

    </div>


    <h3>Sucursales</h3>

    <div class="table-responsive">

        <table class="table table-striped">

            <thead>
            <tr>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Distrito</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="sucursal : ${sucursales}">
                <td th:text="${sucursal.nombre}"></td>
                <td th:text="${sucursal.direccion}"></td>
                <td th:text="${sucursal.distrito}"></td>
            </tr>
            </tbody>

        </table>

    </div>


    <div class="card">

        <div class="card-body">

            <h5>Agregar sucursal</h5>

            <form th:action="@{/empresas/{id}/sucursales(id=${empresa.id})}" method="post" class="row g-2">

                <div class="col-md-4">
                    <input type="text" class="form-control" name="nombre" placeholder="Nombre" required>
                </div>

                <div class="col-md-4">
                    <input type="text" class="form-control" name="direccion" placeholder="Dirección">
                </div>

                <div class="col-md-2">
                    <input type="text" class="form-control" name="distrito" placeholder="Distrito">
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Agregar</button>
                </div>

            </form>

        </div>

    </div>


    <a class="btn btn-secondary mt-4" th:href="@{/empresas}">
        Regresar
    </a>

</div>

</body>

</html>
