<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Empresas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Empresas</h1>

        <a class="btn btn-primary" th:href="@{/empresas/nueva}">
            Nueva empresa
        </a>

    </div>


    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead>
            <tr>
                <th>ID</th>
                <th>Razón social</th>
                <th>RUC</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="empresa : ${empresas}">
                <td th:text="${empresa.id}"></td>
                <td th:text="${empresa.razonSocial}"></td>
                <td th:text="${empresa.ruc}"></td>
                <td>
                    <a class="btn btn-info btn-sm" th:href="@{/empresas/{id}(id=${empresa.id})}">
                        Ver
                    </a>
                </td>
            </tr>
            </tbody>

        </table>

    </div>


    <div th:if="${#lists.isEmpty(empresas)}" class="alert alert-info">
        No existen empresas registradas.
    </div>

</div>

</body>

</html>
