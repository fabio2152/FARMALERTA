<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Nueva empresa</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Nueva empresa</h1>

    <form th:action="@{/empresas}" th:object="${empresa}" method="post">

        <h5 class="mt-4">Datos de la empresa</h5>

        <div class="row g-3">

            <div class="col-md-8">
                <label class="form-label">Razón social</label>
                <input type="text" class="form-control" th:field="*{razonSocial}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">RUC</label>
                <input type="text" class="form-control" th:field="*{ruc}" pattern="\d{11}" maxlength="11" required>
            </div>

        </div>


        <h5 class="mt-4">Primera sucursal</h5>

        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="sucursalNombre" required>
            </div>

            <div class="col-md-5">
                <label class="form-label">Dirección</label>
                <input type="text" class="form-control" name="sucursalDireccion">
            </div>

            <div class="col-md-3">
                <label class="form-label">Distrito</label>
                <input type="text" class="form-control" name="sucursalDistrito">
            </div>

        </div>


        <h5 class="mt-4">Gerente</h5>

        <div class="row g-3">

            <div class="col-md-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" name="gerenteUsuario" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" name="gerenteNombre" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" name="gerenteCorreo">
            </div>

            <div class="col-md-2">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" name="gerenteContrasena" minlength="8" required>
            </div>

        </div>


        <div class="mt-4">

            <button type="submit" class="btn btn-success">
                Guardar
            </button>

            <a class="btn btn-secondary" th:href="@{/empresas}">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>

</html>
