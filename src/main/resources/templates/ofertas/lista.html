<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Ofertas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Ofertas</h1>

    <p class="text-muted">
        Productos sin receta próximos a vencer con descuento. Los productos con receta no se publican como ofertas.
    </p>

    <form th:action="@{/ofertas}" method="get" class="row g-2 mb-4">

        <div class="col-md-6">
            <select class="form-select" name="empresa" required>
                <option value="">Elija una farmacia</option>
                <option
                    th:each="e : ${empresas}"
                    th:value="${e.id}"
                    th:text="${e.razonSocial}"
                    th:selected="${e.id == empresaSeleccionada}"
                ></option>
            </select>
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Ver ofertas</button>
        </div>

    </form>


    <div class="row g-3" th:if="${lotes != null}">

        <div class="col-md-4" th:each="lote : ${lotes}">

            <div class="card h-100 shadow-sm">

                <div class="card-body">

                    <span th:class="${'nivel nivel-' + niveles[lote.id]}" th:text="${'-' + descuentos[lote.id] + ' %'}"></span>

                    <h5 class="mt-2" th:text="${lote.producto.nombreComercial + ' ' + lote.producto.concentracion}"></h5>

                    <p class="text-muted mb-1" th:text="${lote.producto.presentacion}"></p>

                    <p class="mb-1">
                        <del th:text="${'S/ ' + lote.producto.precioVenta}"></del>
                        <strong class="fs-5 text-success" th:text="${'S/ ' + precios[lote.id]}"></strong>
                        <small>por unidad</small>
                    </p>

                    <p class="small mb-0">
                        Vence el <span th:text="${#temporals.format(lote.fechaVencimiento, 'dd/MM/yyyy')}"></span>
                        · <span th:text="${lote.sucursal.nombre}"></span>
                    </p>

                </div>

            </div>

        </div>

    </div>


    <div th:if="${lotes != null and #lists.isEmpty(lotes)}" class="alert alert-info">
        Esta farmacia no tiene ofertas en este momento.
    </div>

</div>

</body>

</html>
