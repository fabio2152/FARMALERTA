<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Demostración</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Demostración</h1>

    <div th:if="${!demo}" class="alert alert-warning">
        El modo demostración está desactivado (farmalerta.demo=false).
    </div>

    <div class="card shadow-sm mb-4" style="max-width: 640px">

        <div class="card-body">

            <p class="mb-1 text-muted">Fecha simulada</p>

            <p class="display-6 fw-bold" th:text="${#temporals.format(hoy, 'dd/MM/yyyy')}"></p>

            <p th:text="${desplazamiento == 0 ? 'Es la fecha real (zona America/Lima).' : 'Adelantada ' + desplazamiento + ' día(s) respecto de la fecha real.'}"></p>

            <div class="d-flex flex-wrap gap-2">

                <form th:action="@{/demo/avanzar-dias}" method="post" class="d-flex gap-2">
                    <input type="number" min="1" max="365" class="form-control" name="dias" value="1" style="width: 90px">
                    <button type="submit" class="btn btn-primary">Avanzar días</button>
                </form>

                <form th:action="@{/demo/restablecer}" method="post">
                    <button type="submit" class="btn btn-outline-secondary">Restablecer</button>
                </form>

                <form th:action="@{/demo/revision-diaria}" method="post">
                    <button type="submit" class="btn btn-danger">Ejecutar revisión diaria</button>
                </form>

            </div>

        </div>

    </div>

    <p class="text-muted">
        La revisión diaria se ejecuta sola cada día a las 00:05 (hora de Lima): bloquea los lotes vencidos,
        crea las notificaciones y genera las recomendaciones de la IA.
    </p>

</div>

</body>

</html>
