<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Nueva venta</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Nueva venta</h1>

    <p class="text-muted">
        El sistema elige los lotes por FEFO (primero el que vence antes), aplica el descuento
        del nivel de alerta de cada lote y nunca usa lotes vencidos ni bloqueados.
    </p>

    <form th:action="@{/ventas}" method="post">

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Producto</label>
                <select class="form-select" name="productoId" required>
                    <option
                        th:each="p : ${productos}"
                        th:value="${p.id}"
                        th:text="${p.nombreComercial + ' ' + p.concentracion + ' — S/ ' + p.precioVenta + ' por unidad'}"
                    ></option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Cantidad (unidades)</label>
                <input type="number" min="1" class="form-control" name="cantidad" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Días de tratamiento (opcional)</label>
                <input type="number" min="1" class="form-control" name="diasTratamiento">
            </div>

        </div>

        <div class="mt-4">

            <button type="submit" class="btn btn-success">Registrar venta</button>

            <a class="btn btn-secondary" th:href="@{/ventas}">Cancelar</a>

        </div>

    </form>

</div>

</body>

</html>
