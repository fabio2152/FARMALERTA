<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Ventas pendientes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Ventas del último día por confirmar</h1>

    <div class="table-responsive">

        <table class="table table-striped align-middle">

            <thead>
            <tr>
                <th>#</th>
                <th>Fecha y hora</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Registró</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s : ${salidas}">
                <td th:text="${s.id}"></td>
                <td th:text="${#temporals.format(s.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${s.producto.nombreComercial}"></td>
                <td th:text="${s.cantidadSolicitada}"></td>
                <td th:text="${s.usuario.nombreCompleto}"></td>
                <td>

                    <a class="btn btn-info btn-sm" th:href="@{/ventas/{id}(id=${s.id})}">Ver</a>

                    <form th:action="@{/ventas/{id}/confirmar(id=${s.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-success btn-sm">Confirmar</button>
                    </form>

                    <form th:action="@{/ventas/{id}/rechazar(id=${s.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Rechazar</button>
                    </form>

                </td>
            </tr>
            </tbody>

        </table>

    </div>


    <div th:if="${#lists.isEmpty(salidas)}" class="alert alert-info">
        No hay ventas pendientes de confirmación.
    </div>

</div>

</body>

</html>
