<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Ventas y salidas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">

        <h1>Historial de salidas</h1>

        <a
            th:if="${session.usuario.rol.name() == 'TECNICO' or session.usuario.rol.name() == 'QUIMICO_FARMACEUTICO'}"
            class="btn btn-primary"
            th:href="@{/ventas/nueva}"
        >
            Nueva venta
        </a>

    </div>


    <div class="table-responsive">

        <table class="table table-striped table-hover align-middle">

            <thead>
            <tr>
                <th>#</th>
                <th>Fecha y hora</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Sucursal</th>
                <th>Producto</th>
                <th>Usuario</th>
                <th></th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s : ${salidas}">
                <td th:text="${s.id}"></td>
                <td th:text="${#temporals.format(s.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${s.tipo}"></td>
                <td>
                    <span
                        th:class="${s.estado.name() == 'REGISTRADA' ? 'badge bg-success' : (s.estado.name() == 'RECHAZADA' ? 'badge bg-secondary' : 'badge bg-warning text-dark')}"
                        th:text="${s.estado}"
                    ></span>
                </td>
                <td th:text="${s.sucursal.nombre}"></td>
                <td th:text="${s.producto != null ? s.producto.nombreComercial : ''}"></td>
                <td th:text="${s.usuario.nombreUsuario}"></td>
                <td>
                    <a class="btn btn-info btn-sm" th:href="@{/ventas/{id}(id=${s.id})}">Ver</a>
                </td>
            </tr>
            </tbody>

        </table>

    </div>


    <div th:if="${#lists.isEmpty(salidas)}" class="alert alert-info">
        Todavía no hay salidas registradas.
    </div>

</div>

</body>

</html>
