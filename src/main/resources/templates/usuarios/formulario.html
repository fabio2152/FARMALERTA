<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Nuevo usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Nuevo usuario</h1>

    <form th:action="@{/usuarios}" th:object="${nuevo}" method="post">

        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" th:field="*{nombreUsuario}" required>
            </div>

            <div class="col-md-8">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" th:field="*{correo}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Contraseña (mínimo 8 caracteres)</label>
                <input type="password" class="form-control" th:field="*{contrasena}" minlength="8" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Rol</label>
                <select class="form-select" th:field="*{rol}" required>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Sucursal (no aplica al gerente)</label>
                <select class="form-select" name="sucursalId">
                    <option th:each="s : ${sucursales}" th:value="${s.id}" th:text="${s.nombre}"></option>
                </select>
            </div>

        </div>

        <div class="mt-4">

            <button type="submit" class="btn btn-success">Guardar</button>

            <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a>

        </div>

    </form>

</div>

</body>

</html>
