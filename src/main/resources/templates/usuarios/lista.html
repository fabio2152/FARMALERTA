<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Usuarios</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Usuarios</h1>

        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">
            Nuevo usuario
        </a>

    </div>


    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead>
            <tr>
                <th>Usuario</th>
                <th>Nombre</th>
                <th>Rol</th>
                <th>Sucursal</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombreUsuario}"></td>
                <td th:text="${u.nombreCompleto}"></td>
                <td th:text="${u.rol}"></td>
                <td th:text="${u.sucursal != null ? u.sucursal.nombre : 'Todas'}"></td>
                <td>
                    <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                    <span th:unless="${u.activo}" class="badge bg-secondary">Inactivo</span>
                </td>
                <td>
                    <form
                        th:if="${u.activo}"
                        th:action="@{/usuarios/{id}/desactivar(id=${u.id})}"
                        method="post"
                        style="display:inline"
                    >
                        <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Desea desactivar al usuario?')"
                        >
                            Desactivar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>

        </table>

    </div>

</div>

</body>

</html>
