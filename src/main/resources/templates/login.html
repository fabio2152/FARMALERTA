<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body class="landing">

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<section class="hero">

    <div class="container">

        <div class="login-tarjeta">

            <div class="text-center mb-4">

                <h1 class="login-marca">
                    Farm<span>alerta</span>
                </h1>

                <p class="login-subtitulo">
                    Ingresa con tu cuenta para continuar
                </p>

            </div>

            <form
                th:action="@{/login}"
                method="post"
            >

                <div class="mb-3">

                    <label class="form-label login-etiqueta" for="nombreUsuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        class="form-control form-control-lg login-campo"
                        id="nombreUsuario"
                        name="nombreUsuario"
                        placeholder="Tu usuario"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label login-etiqueta" for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        class="form-control form-control-lg login-campo"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-farmalerta btn-lg w-100"
                >
                    Ingresar
                </button>

            </form>

            <div class="text-center mt-4">

                <a class="login-volver" th:href="@{/}">
                    ← Volver al inicio
                </a>

            </div>

        </div>

    </div>

</section>


<footer class="pie">
    © Farmalerta
</footer>

</body>

</html>
