<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-5 login-caja">

    <div class="card shadow">

        <div class="card-body p-4">

            <h1 class="h3 mb-4 text-center">Iniciar sesión</h1>

            <form
                th:action="@{/login}"
                method="post"
            >

                <div class="mb-3">

                    <label class="form-label">
                        Usuario
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="nombreUsuario"
                        required
                        autofocus
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="contrasena"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Ingresar
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
