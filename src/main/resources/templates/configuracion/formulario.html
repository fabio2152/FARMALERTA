<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Configuración</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Configuración de la empresa</h1>

    <form th:action="@{/configuracion}" th:object="${configuracion}" method="post">

        <h5 class="mt-4">Umbrales de alerta (días)</h5>

        <div class="row g-3">

            <div class="col-md-3">
                <label class="form-label">Umbral AMARILLO</label>
                <input type="number" class="form-control" th:field="*{umbralAmarillo}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Umbral ROJO</label>
                <input type="number" class="form-control" th:field="*{umbralRojo}" required>
            </div>

        </div>


        <h5 class="mt-4">Descuentos por nivel (%)</h5>

        <div class="row g-3">

            <div class="col-md-3">
                <label class="form-label">AMARILLO</label>
                <input type="number" step="0.01" class="form-control" th:field="*{descuentoAmarillo}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">ROJO</label>
                <input type="number" step="0.01" class="form-control" th:field="*{descuentoRojo}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">ÚLTIMO DÍA</label>
                <input type="number" step="0.01" class="form-control" th:field="*{descuentoUltimoDia}" required>
            </div>

        </div>


        <h5 class="mt-4">Políticas</h5>

        <div class="form-check">
            <input type="checkbox" class="form-check-input" th:field="*{permitirVentaUltimoDia}">
            <label class="form-check-label">Permitir la venta del último día (con confirmación del químico farmacéutico)</label>
        </div>

        <div class="form-check">
            <input type="checkbox" class="form-check-input" th:field="*{permitirVentaBajoCosto}">
            <label class="form-check-label">Permitir vender bajo el costo</label>
        </div>

        <div class="row g-3 mt-1">

            <div class="col-md-3">
                <label class="form-label">Vida útil mínima al ingreso (días)</label>
                <input type="number" class="form-control" th:field="*{vidaUtilMinimaIngreso}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Días de traslado entre sucursales</label>
                <input type="number" class="form-control" th:field="*{diasTraslado}" required>
            </div>

        </div>


        <h5 class="mt-4">Inteligencia Artificial</h5>

        <div class="row g-3">

            <div class="col-md-3">
                <label class="form-label">α (suavizado)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{alfaPrediccion}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Días de historial</label>
                <input type="number" class="form-control" th:field="*{diasHistorial}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Historial mínimo (días)</label>
                <input type="number" class="form-control" th:field="*{diasHistorialMinimo}" required>
            </div>

        </div>


        <button type="submit" class="btn btn-success mt-4">
            Guardar
        </button>

    </form>

</div>

</body>

</html>
