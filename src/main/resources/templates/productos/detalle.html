<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Detalle del producto</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <div class="card shadow">

        <div class="card-body">

            <h1 th:text="${producto.nombreComercial + ' ' + producto.concentracion}"></h1>

            <hr>

            <div class="row">

                <div class="col-md-6">
                    <p><strong>Código:</strong> <span th:text="${producto.codigo}"></span></p>
                    <p><strong>Principio activo:</strong> <span th:text="${producto.principioActivo}"></span></p>
                    <p><strong>Forma farmacéutica:</strong> <span th:text="${producto.formaFarmaceutica}"></span></p>
                    <p><strong>Categoría regulatoria:</strong> <span th:text="${producto.categoriaRegulatoria}"></span></p>
                    <p><strong>Condición de venta:</strong> <span th:text="${producto.condicionVenta}"></span></p>
                    <p><strong>Conservación:</strong> <span th:text="${producto.conservacion}"></span></p>
                </div>

                <div class="col-md-6">
                    <p><strong>Presentación:</strong> <span th:text="${producto.presentacion}"></span></p>
                    <p><strong>Unidades por empaque:</strong> <span th:text="${producto.unidadesPorEmpaque}"></span></p>
                    <p><strong>Laboratorio:</strong> <span th:text="${producto.laboratorio}"></span></p>
                    <p><strong>Registro sanitario:</strong> <span th:text="${producto.registroSanitario}"></span></p>
                    <p><strong>Precio por unidad:</strong> S/ <span th:text="${producto.precioVenta}"></span></p>
                    <p>
                        <strong>Umbrales propios:</strong>
                        <span th:if="${producto.umbralAmarilloPropio != null}"
                              th:text="${'AMARILLO ' + producto.umbralAmarilloPropio + ' / ROJO ' + producto.umbralRojoPropio + ' días'}"></span>
                        <span th:if="${producto.umbralAmarilloPropio == null}">los de la empresa</span>
                    </p>
                </div>

            </div>

            <a class="btn btn-secondary" th:href="@{/productos}">Regresar</a>

            <a class="btn btn-warning" th:href="@{/productos/{id}/editar(id=${producto.id})}">Editar</a>

        </div>

    </div>

</div>

</body>

</html>
