<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Productos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Productos</h1>

        <a class="btn btn-primary" th:href="@{/productos/nuevo}">
            Nuevo producto
        </a>

    </div>


    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Principio activo</th>
                <th>Forma</th>
                <th>Condición</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.codigo}"></td>
                <td th:text="${producto.nombreComercial + ' ' + producto.concentracion}"></td>
                <td th:text="${producto.principioActivo}"></td>
                <td th:text="${producto.formaFarmaceutica}"></td>
                <td th:text="${producto.condicionVenta}"></td>
                <td th:text="${'S/ ' + producto.precioVenta}"></td>
                <td>

                    <a class="btn btn-info btn-sm" th:href="@{/productos/{id}(id=${producto.id})}">
                        Ver
                    </a>

                    <a class="btn btn-warning btn-sm" th:href="@{/productos/{id}/editar(id=${producto.id})}">
                        Editar
                    </a>

                    <form
                        th:action="@{/productos/{id}/eliminar(id=${producto.id})}"
                        method="post"
                        style="display:inline"
                    >
                        <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Desea eliminar el producto?')"
                        >
                            Eliminar
                        </button>
                    </form>

                </td>
            </tr>
            </tbody>

        </table>

    </div>


    <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info">
        No existen productos registrados.
    </div>

</div>

</body>

</html>
