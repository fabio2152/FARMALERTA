<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Nueva transferencia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1>Transferir lote</h1>

    <p class="lead" th:text="${'Lote ' + lote.numeroLote + ' — ' + lote.producto.nombreComercial + ' ' + lote.producto.concentracion}"></p>

    <p class="text-muted">
        Vence en <span th:text="${diasRestantes}"></span> días.
        Unidades vendibles: <span th:text="${lote.cantidadDisponible - lote.cantidadReservada}"></span>.
        Al solicitarla, las unidades quedan reservadas hasta que la sucursal de destino las reciba.
    </p>

    <form th:action="@{/transferencias}" method="post">

        <input type="hidden" name="loteId" th:value="${lote.id}">

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Sucursal de destino</label>
                <select class="form-select" name="sucursalDestinoId" required>
                    <option th:each="s : ${destinos}" th:value="${s.id}" th:text="${s.nombre}"></option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Cantidad</label>
                <input
                    type="number"
                    min="1"
                    class="form-control"
                    name="cantidad"
                    th:value="${lote.cantidadDisponible - lote.cantidadReservada}"
                    required
                >
            </div>

        </div>

        <div class="mt-4">

            <button type="submit" class="btn btn-primary">Solicitar transferencia</button>

            <a class="btn btn-secondary" th:href="@{/lotes/{id}(id=${lote.id})}">Cancelar</a>

        </div>

    </form>

</div>

</body>

</html>
