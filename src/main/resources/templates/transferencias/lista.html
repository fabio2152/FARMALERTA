<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Transferencias</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>

<body>

<div th:replace="~{fragmentos/navbar :: navbar}"></div>


<div class="container py-4">

    <h1 class="mb-4">Transferencias entre sucursales</h1>

    <div class="table-responsive">

        <table class="table table-striped align-middle">

            <thead>
            <tr>
                <th>Fecha</th>
                <th>Lote</th>
                <th>Producto</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Cantidad</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="t : ${transferencias}">
                <td th:text="${#temporals.format(t.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${t.lote.numeroLote}"></td>
                <td th:text="${t.lote.producto.nombreComercial}"></td>
                <td th:text="${t.sucursalOrigen.nombre}"></td>
                <td th:text="${t.sucursalDestino.nombre}"></td>
                <td th:text="${t.cantidad}"></td>
                <td>
                    <span
                        th:class="${t.estado.name() == 'RECIBIDA' ? 'badge bg-success' : (t.estado.name() == 'CANCELADA' ? 'badge bg-secondary' : 'badge bg-warning text-dark')}"
                        th:text="${t.estado}"
                    ></span>
                    <small th:if="${t.recibidaPor != null}" th:text="${'por ' + t.recibidaPor.nombreUsuario}"></small>
                </td>
                <td th:if="${t.estado.name() == 'SOLICITADA' and usuario.sucursal != null}">

                    <form
                        th:if="${usuario.sucursal.id == t.sucursalDestino.id}"
                        th:action="@{/transferencias/{id}/recibir(id=${t.id})}"
                        method="post"
                        style="display:inline"
                    >
                        <button type="submit" class="btn btn-success btn-sm">Recibir</button>
                    </form>

                    <form
                        th:if="${usuario.sucursal.id == t.sucursalOrigen.id and usuario.rol.name() == 'QUIMICO_FARMACEUTICO'}"
                        th:action="@{/transferencias/{id}/cancelar(id=${t.id})}"
                        method="post"
                        style="display:inline"
                    >
                        <button type="submit" class="btn btn-outline-danger btn-sm">Cancelar</button>
                    </form>

                </td>
                <td th:unless="${t.estado.name() == 'SOLICITADA' and usuario.sucursal != null}"></td>
            </tr>
            </tbody>

        </table>

    </div>


    <div th:if="${#lists.isEmpty(transferencias)}" class="alert alert-info">
        No hay transferencias. Se solicitan desde el detalle de un lote o desde las recomendaciones de la IA.
    </div>

</div>

</body>

</html>
